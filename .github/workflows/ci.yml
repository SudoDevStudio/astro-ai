name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      # Needs a real layout engine, so jsdom cannot stand in for it. Skips
      # itself with a message on a runner without Chrome.
      - run: npm run test:layout
      - run: npm pack --dry-run
