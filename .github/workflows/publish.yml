name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply before publishing
        type: choice
        options: [patch, minor, major]
        default: patch
      dist_tag:
        description: npm dist-tag to publish under
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # A release published by hand still has to name the version it ships.
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e "const pkg = require('./package.json');
          const expected = 'v' + pkg.version;
          if (process.env.RELEASE_TAG !== expected) {
            console.error('Release tag must be ' + expected + ', received ' + process.env.RELEASE_TAG);
            process.exit(1);
          }"

      # A dispatched run picks the version itself, so there is no tag to write
      # by hand. `npm version` rewrites package.json and package-lock.json
      # together, which keeps the `npm ci` below in sync.
      - name: Bump the version
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Resolve the version being published
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - run: npm ci --include=optional
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

      # Publishing comes before tagging: a failed publish leaves no tag behind
      # claiming a version that never shipped.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || (github.event.release.prerelease && 'next' || 'latest') }}
        run: npm publish --tag "$DIST_TAG"

      - name: Tag and push the published version
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "release: $TAG"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

      # Releases created with GITHUB_TOKEN do not start another workflow run,
      # so this cannot loop back into the `release: published` trigger above.
      - name: Create the GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ inputs.dist_tag == 'next' && '--prerelease' || '' }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE
